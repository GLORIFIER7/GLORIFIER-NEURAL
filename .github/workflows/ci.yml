name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_head_sha:
        description: "Exact immutable PR head SHA to test when dispatching for a generated PR."
        required: false
        type: string
      pull_request_number:
        description: "Open PR number to validate during generated-PR dispatch."
        required: false
        type: string
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Run when either identifier is supplied so a partial PR identity fails closed; with neither input, run ordinary CI.
      - name: Validate manual dispatch PR identity
        id: validate-pr-identity
        if: github.event_name == 'workflow_dispatch' && (inputs.pull_request_number != '' || inputs.pull_request_head_sha != '')
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          PR_HEAD_SHA: ${{ inputs.pull_request_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::A pull request number is required with a dispatched PR head SHA."
            exit 1
          }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::An exact PR head SHA is required with a dispatched pull request number."
            exit 1
          }
      - name: Verify dispatched PR head against GitHub
        id: current-pr
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.pull_request_number != '' || inputs.pull_request_head_sha != '') && steps.validate-pr-identity.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_PR_HEAD_SHA: ${{ inputs.pull_request_head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ["PR_NUMBER"]
          expected_head_sha = os.environ["EXPECTED_PR_HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          if not re.fullmatch(r"[1-9][0-9]*", pull_number):
              raise SystemExit("A valid pull request number is required.")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", expected_head_sha):
              raise SystemExit("An exact 40-character PR head SHA is required.")
          url = f"https://api.github.com/repos/{repository}/pulls/{pull_number}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"GitHub PR identity lookup failed (HTTP {exc.code})."
              ) from None
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit("GitHub PR identity lookup is unavailable.") from None
          except (json.JSONDecodeError, UnicodeDecodeError):
              raise SystemExit(
                  "GitHub PR identity lookup returned invalid JSON."
              ) from None
          if not isinstance(payload, dict):
              raise SystemExit("GitHub PR identity lookup returned an invalid response.")
          current_head_sha = (payload.get("head") or {}).get("sha", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", current_head_sha):
              raise SystemExit("GitHub returned an invalid pull request head SHA.")
          if expected_head_sha.casefold() != current_head_sha.casefold():
              raise SystemExit(
                  "The dispatched PR head SHA does not match the pull request's current head."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("head_sha=" + current_head_sha + chr(10))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.current-pr.outputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Validate committed dependency lock
        run: uv lock --check
      - name: Export hash-pinned development requirements
        run: uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
      - name: Install only wheel distributions at locked versions
        run: "python -m pip install --only-binary=:all: --require-hashes -r /tmp/requirements.txt"
      - run: "python -m pip install --only-binary=:all: --no-deps -e ."
      - run: ruff check .
      - run: pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install --only-binary=:all: --upgrade "setuptools>=83.0.0" pip-audit
          pip-audit
      - name: Build container image (no publish)
        run: docker build --tag glorifier-neural:ci .
      - name: Verify runtime image includes the Neon PostgreSQL driver
        run: docker run --rm --entrypoint python glorifier-neural:ci -c "import psycopg; assert psycopg.__version__"
      - name: Export the exact image that passed the Python 3.12 test job
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output /tmp/glorifier-neural-ci.tar glorifier-neural:ci
      - name: Upload the CI-tested container image
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glorifier-neural-image-${{ github.sha }}
          path: /tmp/glorifier-neural-ci.tar
          if-no-files-found: error
          retention-days: 1
  publish-container:
    name: Publish the CI-tested NEURAL image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the exact image exported by the passing CI matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glorifier-neural-image-${{ github.sha }}
          path: /tmp/glorifier-neural-image
      - name: Publish the CI-tested run-attempt image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/glorifier7/glorifier-neural:0.0.0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker load --input /tmp/glorifier-neural-image/glorifier-neural-ci.tar
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag glorifier-neural:ci "$IMAGE"
          docker push "$IMAGE"

