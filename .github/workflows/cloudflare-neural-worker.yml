name: Cloudflare Neural Worker

on:
  pull_request:
    paths:
      - "app/**"
      - "cloudflare/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cloudflare-neural-worker.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the Neural Worker to Cloudflare production"
        required: true
        default: false
        type: boolean

concurrency:
  group: cloudflare-neural-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Resolve Cloudflare-only dependency lock
        working-directory: cloudflare
        run: uv lock
      - name: Install Cloudflare Worker dependencies
        working-directory: cloudflare
        run: uv sync --locked --group dev
      - name: Build Cloudflare Python Worker bundle without deployment
        working-directory: cloudflare
        run: uv run --locked pywrangler deploy --dry-run
      - name: Upload the generated Cloudflare lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-neural-uv-lock
          path: cloudflare/uv.lock
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: glorifier-neural-cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Download the exact dependency lock validated by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cloudflare-neural-uv-lock
          path: cloudflare

      - name: Install locked Cloudflare Worker dependencies
        working-directory: cloudflare
        run: uv sync --locked --group dev
      - name: Verify Cloudflare deployment credential exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN in the glorifier-neural-cloudflare-production environment"
            exit 1
          }
      - name: Deploy Neural Worker to Cloudflare
        working-directory: cloudflare
        run: uv run --locked pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
