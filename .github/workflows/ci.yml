name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request_review'
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Validate committed dependency lock
        run: uv lock --check
      - name: Export hash-pinned development requirements
        run: uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
      - name: Install only wheel distributions at locked versions
        run: "python -m pip install --only-binary=:all: --require-hashes -r /tmp/requirements.txt"
      - run: "python -m pip install --only-binary=:all: --no-deps -e ."
      - run: ruff check .
      - run: pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install --only-binary=:all: --upgrade "setuptools>=83.0.0" pip-audit
          pip-audit
      - name: Build container image (no publish)
        run: docker build --tag glorifier-neural:ci .
      - name: Verify runtime image includes the Neon PostgreSQL driver
        run: docker run --rm --entrypoint python glorifier-neural:ci -c "import psycopg; assert psycopg.__version__"
      - name: Save CI-tested container image for main-branch publishing
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output /tmp/glorifier-neural-ci.tar glorifier-neural:ci
      - name: Upload the exact CI-tested container image
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glorifier-neural-image-${{ github.sha }}
          path: /tmp/glorifier-neural-ci.tar
          if-no-files-found: error
          retention-days: 1

  ai-review-policy:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    name: AI Review Policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable action pin
        with:
          python-version: "3.12"
      - name: Verify the trusted policy runner is importable
        working-directory: trusted-policy
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
        run: python -c "import app.ai_review_policy; print('Trusted AI review policy runner import verified')"
      - name: Resolve canonical PR head SHA from GitHub
        id: current-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/pulls/{pull_number}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          head_sha = (payload.get("head") or {}).get("sha", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", head_sha):
              raise SystemExit("GitHub returned an invalid pull request head SHA.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("head_sha=" + head_sha + chr(10))
          PY
      - name: Wait for both AI reviewers and enforce their findings
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.current-pr.outputs.head_sha }}
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
          AI_REVIEW_WAIT_SECONDS: "900"
          AI_REVIEW_POLL_INTERVAL_SECONDS: "30"
        working-directory: trusted-policy
        run: python -m app.ai_review_policy

  publish-container:
    name: Publish the CI-tested NEURAL image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the exact image exported by the passing CI test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glorifier-neural-image-${{ github.sha }}
          path: /tmp/glorifier-neural-image
      - name: Load and publish the immutable commit-tagged image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/glorifier7/glorifier-neural:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker load --input /tmp/glorifier-neural-image/glorifier-neural-ci.tar
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag glorifier-neural:ci "$IMAGE"
          docker push "$IMAGE"
          docker logout ghcr.io

