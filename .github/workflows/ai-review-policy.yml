name: AI Review Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: ai-review-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-review-policy:
    name: AI Review Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable action pin
        with:
          python-version: "3.12"
      - name: Install the repository package for the policy runner
        run: python -m pip install --only-binary=:all: --no-deps -e .
      - name: Wait for both AI reviewers and enforce their findings
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_WAIT_SECONDS: "900"
          AI_REVIEW_POLL_INTERVAL_SECONDS: "30"
        run: python -m app.ai_review_policy
