name: Generate dependency lock (remediation branch only)

on:
  push:
    branches:
      - security/sonar-lockfile-remediation

permissions:
  contents: write

concurrency:
  group: generate-uv-lock
  cancel-in-progress: true

jobs:
  lock:
    if: github.repository == 'GLORIFIER7/GLORIFIER-NEURAL' && github.ref == 'refs/heads/security/sonar-lockfile-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/sonar-lockfile-remediation
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Resolve and validate dependency lock
        run: uv lock
      - name: Commit generated lockfile to remediation branch
        run: |
          test -s uv.lock
          if git ls-files --error-unmatch uv.lock >/dev/null 2>&1 && git diff --quiet -- uv.lock; then
            echo "Tracked uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f uv.lock
          git diff --cached --check
          git commit -m "Security: add resolver-generated uv lockfile"
          git push origin HEAD:security/sonar-lockfile-remediation
