name: AI Review Status Diagnostics

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trusted-ai-review-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-trusted-policy-status:
    name: AI Review Status Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Publish status for every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m app.ai_review_status
