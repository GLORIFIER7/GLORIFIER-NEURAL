name: Trusted AI Review Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open pull request number to evaluate."
        required: true
        type: string
      pull_request_head_sha:
        description: "Exact immutable pull request head SHA to evaluate."
        required: true
        type: string

concurrency:
  group: trusted-ai-review-policy-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || (github.event_name == 'pull_request_review' && github.event.review.pull_request.number) || github.event.pull_request.number }}
  cancel-in-progress: true

# This workflow never checks out or executes pull-request head code.
# Policy code is always loaded from the protected default branch (main).
permissions:
  contents: read
  pull-requests: read

jobs:
  ai-review-policy:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Trusted AI Review Policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_head_sha: ${{ steps.current-pr.outputs.head_sha }}
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: trusted-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable action pin
        with:
          python-version: "3.12"
      - name: Verify trusted policy runner
        working-directory: trusted-policy
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
        run: python -c "import app.ai_review_policy; print('Trusted AI review policy runner import verified')"
      - name: Resolve canonical PR head SHA from GitHub
        id: current-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || (github.event_name == 'pull_request_review' && github.event.review.pull_request.number) || github.event.pull_request.number }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_head_sha || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          expected_head_sha = os.environ.get("EXPECTED_PR_HEAD_SHA", "")
          if not re.fullmatch(r"[1-9][0-9]*", pull_number):
              raise SystemExit("A valid open pull request number is required.")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and not re.fullmatch(
              r"[0-9a-fA-F]{40}", expected_head_sha
          ):
              raise SystemExit("An exact 40-character PR head SHA is required for a dispatched policy run.")
          url = f"https://api.github.com/repos/{repository}/pulls/{pull_number}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"GitHub PR identity lookup failed (HTTP {exc.code})."
              ) from None
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit("GitHub PR identity lookup is unavailable.") from None
          except (json.JSONDecodeError, UnicodeDecodeError):
              raise SystemExit(
                  "GitHub PR identity lookup returned invalid JSON."
              ) from None
          if not isinstance(payload, dict):
              raise SystemExit("GitHub PR identity lookup returned an invalid response.")
          head_sha = (payload.get("head") or {}).get("sha", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", head_sha):
              raise SystemExit("GitHub returned an invalid pull request head SHA.")
          if expected_head_sha and expected_head_sha.casefold() != head_sha.casefold():
              raise SystemExit("The current PR head SHA does not match the dispatched commit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("head_sha=" + head_sha + chr(10))
          PY
      - name: Enforce both AI reviewer findings on the exact current PR head
        if: steps.current-pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || (github.event_name == 'pull_request_review' && github.event.review.pull_request.number) || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.current-pr.outputs.head_sha }}
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
          AI_REVIEW_WAIT_SECONDS: "900"
          AI_REVIEW_POLL_INTERVAL_SECONDS: "30"
        working-directory: trusted-policy
        run: python -m app.ai_review_policy

  publish-dispatch-result:
    name: Publish trusted policy result on PR head
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: [ai-review-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Publish success or failure on the canonical current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || (github.event_name == 'pull_request_review' && github.event.review.pull_request.number) || github.event.pull_request.number }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_head_sha || '' }}
          POLICY_HEAD_SHA: ${{ needs.ai-review-policy.outputs.pr_head_sha }}
          POLICY_RESULT: ${{ needs.ai-review-policy.result }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ.get("PR_NUMBER", "")
          expected_head_sha = os.environ.get("EXPECTED_PR_HEAD_SHA", "")
          policy_head_sha = os.environ.get("POLICY_HEAD_SHA", "")
          token = os.environ["GH_TOKEN"]
          policy_result = os.environ["POLICY_RESULT"]
          run_id = os.environ["WORKFLOW_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]*", pull_number):
              raise SystemExit("A valid pull request number is required.")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", expected_head_sha):
              raise SystemExit("An exact 40-character PR head SHA is required.")
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("A valid workflow run ID is required.")

          api_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          pr_request = Request(
              f"https://api.github.com/repos/{repository}/pulls/{pull_number}",
              headers=api_headers,
          )
          try:
              with urlopen(pr_request, timeout=20) as response:
                  pr = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"GitHub PR identity lookup failed (HTTP {exc.code})."
              ) from None
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit("GitHub PR identity lookup is unavailable.") from None
          except (json.JSONDecodeError, UnicodeDecodeError):
              raise SystemExit(
                  "GitHub PR identity lookup returned invalid JSON."
              ) from None
          if not isinstance(pr, dict):
              raise SystemExit("GitHub PR identity lookup returned an invalid response.")
          current_head_sha = (pr.get("head") or {}).get("sha", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", current_head_sha):
              raise SystemExit("GitHub returned an invalid pull request head SHA.")
          if expected_head_sha and current_head_sha.casefold() != expected_head_sha.casefold():
              stale_summary = (
                  f"The evaluation was dispatched for head {expected_head_sha} but "
                  f"the pull request has since advanced to {current_head_sha}. "
                  "The dispatched evaluation is stale; the latest head must be re-evaluated."
              )
              stale_payload = {
                  "name": "Trusted AI Review Policy",
                  "head_sha": current_head_sha,
                  "status": "completed",
                  "conclusion": "failure",
                  "external_id": f"trusted-ai-review-policy:{run_id}",
                  "details_url": f"https://github.com/{repository}/actions/runs/{run_id}",
                  "output": {
                      "title": "Trusted AI Review Policy",
                      "summary": stale_summary,
                  },
              }
              stale_request = Request(
                  f"https://api.github.com/repos/{repository}/check-runs",
                  data=json.dumps(stale_payload).encode("utf-8"),
                  headers={**api_headers, "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urlopen(stale_request, timeout=20) as stale_response:
                      stale_response.read()
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"GitHub check publication failed (HTTP {exc.code})."
                  ) from None
              except (urllib.error.URLError, TimeoutError, OSError):
                  raise SystemExit("GitHub check publication is unavailable.") from None
              raise SystemExit(
                  f"Stale dispatch: head advanced from {expected_head_sha} to "
                  f"{current_head_sha}; published failure check on latest head."
              )

          policy_head_matches = (
              bool(re.fullmatch(r"[0-9a-fA-F]{40}", policy_head_sha))
              and policy_head_sha.casefold() == current_head_sha.casefold()
          )
          conclusion = (
              "success"
              if policy_result == "success" and policy_head_matches
              else "failure"
          )
          summary = (
              f"Trusted review policy result: '{policy_result}'. "
              f"Canonical PR head: {current_head_sha}. "
              f"Evaluator verified this head: {str(policy_head_matches).lower()}."
          )
          payload = {
              "name": "Trusted AI Review Policy",
              "head_sha": current_head_sha,
              "status": "completed",
              "conclusion": conclusion,
              "external_id": f"trusted-ai-review-policy:{run_id}",
              "details_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "output": {
                  "title": "Trusted AI Review Policy",
                  "summary": summary,
              },
          }
          check_request = Request(
              f"https://api.github.com/repos/{repository}/check-runs",
              data=json.dumps(payload).encode("utf-8"),
              headers={**api_headers, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(check_request, timeout=20) as response:
                  check = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"GitHub check publication failed (HTTP {exc.code})."
              ) from None
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit("GitHub check publication is unavailable.") from None
          except (json.JSONDecodeError, UnicodeDecodeError):
              raise SystemExit(
                  "GitHub check publication returned invalid JSON."
              ) from None
          if not isinstance(check, dict):
              raise SystemExit("GitHub check publication returned an invalid response.")
          if check.get("head_sha", "").casefold() != current_head_sha.casefold():
              raise SystemExit("GitHub created the policy check on an unexpected commit.")
          if check.get("name") != "Trusted AI Review Policy":
              raise SystemExit("GitHub created a check with an unexpected name.")
          if check.get("conclusion") != conclusion:
              raise SystemExit("GitHub created a check with an unexpected conclusion.")
          PY
