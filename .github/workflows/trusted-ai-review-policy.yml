name: Trusted AI Review Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open pull request number to evaluate."
        required: true
        type: string
      pull_request_head_sha:
        description: "Exact immutable pull request head SHA to evaluate."
        required: true
        type: string

concurrency:
  group: trusted-ai-review-policy-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: true

# This workflow intentionally runs with read-only permissions and never checks out
# or executes pull-request head code. The workflow definition and evaluator are
# taken from the trusted base revision.
permissions:
  contents: read
  pull-requests: read

jobs:
  ai-review-policy:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Trusted AI Review Policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable action pin
        with:
          python-version: "3.12"
      - name: Verify trusted policy runner
        working-directory: trusted-policy
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
        run: python -c "import app.ai_review_policy; print('Trusted AI review policy runner import verified')"
      - name: Resolve canonical PR head SHA from GitHub
        id: current-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_head_sha || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          expected_head_sha = os.environ.get("EXPECTED_PR_HEAD_SHA", "")
          if not re.fullmatch(r"[1-9][0-9]*", pull_number):
              raise SystemExit("A valid open pull request number is required.")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and not re.fullmatch(
              r"[0-9a-fA-F]{40}", expected_head_sha
          ):
              raise SystemExit("An exact 40-character PR head SHA is required for a dispatched policy run.")
          url = f"https://api.github.com/repos/{repository}/pulls/{pull_number}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          head_sha = (payload.get("head") or {}).get("sha", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", head_sha):
              raise SystemExit("GitHub returned an invalid pull request head SHA.")
          if expected_head_sha and expected_head_sha.casefold() != head_sha.casefold():
              raise SystemExit("The current PR head SHA does not match the dispatched commit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("head_sha=" + head_sha + chr(10))
          PY
      - name: Enforce both AI reviewer findings on the exact current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.current-pr.outputs.head_sha }}
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
          AI_REVIEW_WAIT_SECONDS: "900"
          AI_REVIEW_POLL_INTERVAL_SECONDS: "30"
        working-directory: trusted-policy
        run: python -m app.ai_review_policy
