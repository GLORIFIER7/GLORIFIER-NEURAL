name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Optional PR number to run trusted current-head AI review policy."
        required: false
        type: number
      pull_request_head_sha:
        description: "Exact immutable PR head SHA to test when dispatching for a generated PR."
        required: false
        type: string
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request_review'
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_head_sha != '' && inputs.pull_request_head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Validate committed dependency lock
        run: uv lock --check
      - name: Export hash-pinned development requirements
        run: uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
      - name: Install only wheel distributions at locked versions
        run: "python -m pip install --only-binary=:all: --require-hashes -r /tmp/requirements.txt"
      - run: "python -m pip install --only-binary=:all: --no-deps -e ."
      - run: ruff check .
      - run: pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install --only-binary=:all: --upgrade "setuptools>=83.0.0" pip-audit
          pip-audit
      - name: Build container image (no publish)
        run: docker build --tag glorifier-neural:ci .
      - name: Verify runtime image includes the Neon PostgreSQL driver
        run: docker run --rm --entrypoint python glorifier-neural:ci -c "import psycopg; assert psycopg.__version__"

  ai-review-policy:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
    name: AI Review Policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable action pin
        with:
          python-version: "3.12"
      - name: Verify the trusted policy runner is importable
        working-directory: trusted-policy
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
        run: python -c "import app.ai_review_policy; print('Trusted AI review policy runner import verified')"
      - name: Resolve canonical PR head SHA from GitHub
        id: current-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_head_sha || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/pulls/{pull_number}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          head_sha = (payload.get("head") or {}).get("sha", "")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", head_sha):
              raise SystemExit("GitHub returned an invalid pull request head SHA.")
          expected_head_sha = os.environ.get("EXPECTED_PR_HEAD_SHA", "")
          if expected_head_sha and (
              not re.fullmatch(r"[0-9a-fA-F]{40}", expected_head_sha)
              or expected_head_sha.casefold() != head_sha.casefold()
          ):
              raise SystemExit("The current PR head SHA does not match the dispatched commit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("head_sha=" + head_sha + chr(10))
          PY
      - name: Wait for both AI reviewers and enforce their findings
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.current-pr.outputs.head_sha }}
          PYTHONPATH: ${{ github.workspace }}/trusted-policy
          AI_REVIEW_WAIT_SECONDS: "900"
          AI_REVIEW_POLL_INTERVAL_SECONDS: "30"
        working-directory: trusted-policy
        run: python -m app.ai_review_policy
