name: Trusted AI Review Status

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: trusted-ai-review-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-trusted-policy-status:
    name: Trusted AI Review Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable action pin
        with:
          python-version: "3.12"
      - name: Publish status for every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m app.ai_review_status
