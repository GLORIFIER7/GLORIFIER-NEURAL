name: NEURAL Governed AI Maintenance

on:
  schedule:
    # Weekly at 09:41 Laos time; cost-gated with AI_MAINTENANCE_AUTORUN=true.
    - cron: "41 2 * * 1"
  workflow_dispatch:
    inputs:
      authorize_pull_request:
        description: "Authorize this run to open a draft PR after validation."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neural-ai-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve AI maintenance authorization
        id: authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_AUTHORIZATION: ${{ inputs.authorize_pull_request }}
          SCHEDULE_AUTHORIZATION: ${{ vars.AI_MAINTENANCE_AUTORUN }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_AUTHORIZATION" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_AUTHORIZATION" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce PR publication window (Laos)
        id: time_window
        shell: bash
        run: |
          set -euo pipefail
          current_hhmm="$(TZ=Asia/Vientiane date +%H%M)"
          if [[ "$current_hhmm" -lt 0831 ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI maintenance publication is held until after 08:30 Asia/Vientiane."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check OpenAI credential availability
        id: provider
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.time_window.outputs.allowed == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.time_window.outputs.allowed == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned action revision
        with:
          python-version: "3.12"

      - name: Set up uv
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.time_window.outputs.allowed == 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      - name: Verify trusted dependency lock before agent execution
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' }}
        run: uv lock --check

      - name: Prepare isolated agent workspace
        id: agent_workspace
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.time_window.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if find app tests -type l -print -quit | grep -q .; then
            echo "::error::Existing symlink found in app/ or tests/; refusing to expose it to Codex."
            exit 1
          fi
          agent_dir="$RUNNER_TEMP/neural-agent-workspace"
          rm -rf "$agent_dir"
          mkdir -p "$agent_dir/scripts" "$agent_dir/.github/workflows"
          cp -a app tests "$agent_dir/"
          cp pyproject.toml uv.lock "$agent_dir/"
          cp scripts/validate_ai_maintenance_scope.py "$agent_dir/scripts/"
          cp .github/workflows/ai-maintenance.yml "$agent_dir/.github/workflows/"
          if find "$agent_dir/app" "$agent_dir/tests" -type l -print -quit | grep -q .; then
            echo "::error::Symlink found in the isolated agent workspace."
            exit 1
          fi
          git -C "$agent_dir" init -q
          git -C "$agent_dir" config user.name "NEURAL isolated maintenance workspace"
          git -C "$agent_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$agent_dir" add -- app tests pyproject.toml uv.lock scripts .github
          git -C "$agent_dir" commit -m "sandbox: trusted maintenance baseline"
          echo "path=$agent_dir" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies in isolated agent workspace
        if: ${{ steps.agent_workspace.outputs.path != '' }}
        env:
          UV_PROJECT_ENVIRONMENT: ${{ steps.agent_workspace.outputs.path }}/.venv
        run: uv sync --locked --extra dev --no-install-project

      - name: Run Codex maintenance agent
        id: codex
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.agent_workspace.outputs.path != '' && steps.time_window.outputs.allowed == 'true' }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # pinned action revision
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ steps.agent_workspace.outputs.path }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          effort: high
          prompt: |
            Act as a senior Python reliability and security engineer maintaining GLORIFIER-NEURAL.
            Inspect the application and its tests. Identify at most one concrete, reproducible,
            low-risk bug or reliability weakness and implement a focused fix with a regression test.
            Keep the patch small. Work only in app/ and tests/. Do not modify workflows, dependency
            manifests or lockfiles, scripts/validate_ai_maintenance_scope.py, security policy,
            app/ai_review_policy.py, or protected governance tests. Do not access secrets, credentials,
            environment values, production systems, databases, or deployment APIs. This is an isolated
            copy; only app/ and tests/ changes are eligible for copy-back. Run
            "uv run --locked ruff check app tests" and the closest relevant focused test file(s).
            The full repository Ruff and pytest suites run after copy-back. If no safe, evidence-backed
            improvement is available, leave the working tree unchanged. Do not commit or push.

      - name: Copy validated app and tests changes back
        id: restore
        if: ${{ steps.codex.outcome == 'success' && steps.agent_workspace.outputs.path != '' }}
        env:
          AGENT_WORKSPACE: ${{ steps.agent_workspace.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          for allowed_dir in app tests; do
            if [ ! -d "$AGENT_WORKSPACE/$allowed_dir" ]; then
              echo "::error::Codex removed the required $allowed_dir directory."
              exit 1
            fi
            if find "$AGENT_WORKSPACE/$allowed_dir" -type l -print -quit | grep -q .; then
              echo "::error::Codex created a symlink in $allowed_dir; refusing to copy it back."
              exit 1
            fi
          done
          for protected in \
            app/ai_review_policy.py \
            tests/test_ai_maintenance_scope.py \
            tests/test_ai_review_policy.py \
            tests/test_ci_workflow_security.py; do
            if [ -f "$GITHUB_WORKSPACE/$protected" ]; then
              if [ ! -f "$AGENT_WORKSPACE/$protected" ] || ! cmp -s "$GITHUB_WORKSPACE/$protected" "$AGENT_WORKSPACE/$protected"; then
                echo "::error::Codex changed a protected governance file: $protected"
                exit 1
              fi
            fi
          done
          rsync -a --delete "$AGENT_WORKSPACE/app/" "$GITHUB_WORKSPACE/app/"
          rsync -a --delete "$AGENT_WORKSPACE/tests/" "$GITHUB_WORKSPACE/tests/"

      - name: Check changed paths and prepare review patch
        id: stage
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.codex.outcome == 'success' && steps.restore.outcome == 'success' && steps.time_window.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check
          python scripts/validate_ai_maintenance_scope.py --repo "$GITHUB_WORKSPACE"
          git add -- app tests
          git diff --cached --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate generated patch with locked project checks
        id: validation
        if: ${{ steps.stage.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          uv lock --check
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          python -m pip install --only-binary=:all: --require-hashes -r /tmp/requirements.txt
          python -m pip install --only-binary=:all: --no-deps -e .
          ruff check .
          pytest

      - name: Create isolated maintenance branch
        id: branch
        if: ${{ steps.stage.outputs.changed == 'true' && steps.validation.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="ai/maintenance/${{ github.run_id }}"
          git config user.name "GLORIFIER NEURAL AI Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null checkout -b "$BRANCH"
          git -c core.hooksPath=/dev/null commit -m "ai: governed NEURAL maintenance"
          gh auth setup-git
          git config core.hooksPath /dev/null
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request
        if: ${{ steps.branch.outputs.branch != '' && steps.validation.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --draft --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "AI Maintenance: NEURAL reliability proposal" \
            --body "Autonomous GLORIFIER-NEURAL maintenance proposal. Locked dependency, Ruff, and pytest validation ran before publication. This PR remains a draft and is not auto-merged."

      - name: Run CI against the generated PR branch
        if: ${{ steps.branch.outputs.branch != '' && steps.validation.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ steps.branch.outputs.branch }}"

      - name: Report that the Laos publication window is closed
        if: ${{ steps.time_window.outputs.allowed != 'true' }}
        run: echo "::notice::No model was invoked and no PR was created because it is before 08:31 Asia/Vientiane."

      - name: Report that AI maintenance is not enabled
        if: ${{ steps.authorization.outputs.enabled != 'true' }}
        run: |
          echo "::notice::No AI model was invoked. Enable the weekly schedule by setting the repository Actions variable AI_MAINTENANCE_AUTORUN=true, or manually dispatch with authorize_pull_request=true."

      - name: Report missing API key
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured != 'true' }}
        run: |
          echo "::warning::OPENAI_API_KEY is not configured. AI maintenance did not run."

      - name: Report Codex capacity limitation
        if: ${{ failure() && steps.codex.outcome == 'failure' }}
        run: echo "::warning::Codex execution failed; inspect provider quota/capacity and do not retry aggressively."
