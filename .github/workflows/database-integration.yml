name: Disposable PostgreSQL migration tests

on:
  pull_request:
    branches: [main]
    paths:
      - "db/**"
      - "tests/integration/**"
      - ".github/workflows/database-integration.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "tests/integration/**"
      - ".github/workflows/database-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glorifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glorifier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GLORIFIER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glorifier_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client and test driver
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3.2,<4.0"
      - name: Create isolated migration role
        run: psql "$GLORIFIER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN"
      - name: Apply proposed Neon migration to disposable database
        run: psql "$GLORIFIER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/neon/migrations/0001_task_runs.sql
      - name: Apply proposed Supabase-compatible migration to disposable database
        run: psql "$GLORIFIER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/supabase/migrations/0001_audit_events.sql
      - name: Verify constraints, RLS, and least-privilege grants
        run: python tests/integration/test_database_migrations.py
